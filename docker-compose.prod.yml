
services:
  mangueras-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mangueras_ever
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NODE_ENV: production
      INDICADORES_API_URL: http://indicadores-api:8001
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      SORTEO_FOTOS_DIR: /app/img_sorteo
    volumes:
      - ./employees:/app/employees:ro
      - ./img_sorteo:/app/img_sorteo:ro
    ports:
      - "3001:3000"
    networks:
      - ai-net
      
  indicadores-api:
    build: ./indicadores-api
    container_name: indicadores_api
    env_file:
      - ./indicadores-api/.env
    # DNS de Active Directory (DC) para resolver SRV-SQL.everwear.local y el KDC.
    # Sin esto el contenedor cae al DNS público y no resuelve nombres internos.
    dns:
      - 10.10.0.232
      - 10.10.0.254
    dns_search:
      - everwear.local
    volumes:
      # - /tmp/krb5cc_1000:/tmp/krb5cc_1000:ro
      - /opt/krb5cc:/krb:ro
    environment:
      KRB5CCNAME: FILE:/krb/cc
    restart: unless-stopped
    networks:
      - ai-net
networks:
  ai-net:
    external: true

