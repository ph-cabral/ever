name: Deploy Páginas Amarillas Worker

# Deploy separado del de la app principal (ver deploy.yml): este Worker no
# corre dentro del Docker de Next.js, se despliega directo a la red de
# Cloudflare. Por eso tiene su propio workflow, disparado solo cuando cambia
# algo dentro de workers/paginasamarillas-scraper/ — no en cada push a main.
on:
  push:
    branches: [main]
    paths:
      - "workers/paginasamarillas-scraper/**"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: workers/paginasamarillas-scraper
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx wrangler deploy
        env:
          # Secret de GitHub Actions (Settings → Secrets and variables →
          # Actions). NO es lo mismo que PA_WORKER_SECRET del .env de
          # Next.js: este token es el de tu cuenta de Cloudflare para poder
          # deployar, wrangler lo toma solo de esta env var (auth no
          # interactiva, reemplaza a `wrangler login` en CI).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
