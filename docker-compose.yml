services:
  mangueras-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangueras_ever
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://n8n:3v3rW3ar@n8n_sql:5432/n8n?schema=fabrica
      NODE_ENV: development
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ai-net

networks:
  ai-net:
    external: true
